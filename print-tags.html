<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Printable Plant Stakes — The Little Garden Nursery</title>
  <link rel="stylesheet" href="analytics-consent.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Georgia, serif;
      background: #f0f0f0;
      color: #244638;
      padding: 20px;
    }
    .no-print {
      max-width: 800px;
      margin: 0 auto 20px;
      background: white;
      padding: 16px 24px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: Arial, sans-serif;
    }
    .btn-print {
      background: #244638;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }
    /* Grid container for standard US Letter (8.5 x 11) sheet */
    .sheet {
      max-width: 8.5in;
      margin: auto;
      display: grid;
      grid-template-columns: repeat(2, 3.8in);
      gap: 0.3in;
      justify-content: center;
    }
    /* 2" x 4.5" Garden Pot Stake Format */
    .stake {
      width: 3.8in;
      height: 4.8in;
      background: white;
      border: 1.5px dashed #8ba394;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      page-break-inside: avoid;
    }
    .nursery-title {
      font-size: 10px;
      font-family: Arial, sans-serif;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #b97859;
      font-weight: bold;
    }
    .plant-name {
      font-size: 20px;
      color: #244638;
      line-height: 1.15;
      margin: 0;
    }
    .plant-heading {
      margin: 4px 0 6px;
    }
    .plant-photo {
      width: 2in;
      height: 2in;
      max-width: 100%;
      object-fit: cover;
      border-radius: 6px;
      margin-top: 8px;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }
    .care-notes {
      font-family: Arial, sans-serif;
      font-size: 10px;
      color: #555;
      line-height: 1.4;
      margin-bottom: 8px;
    }
    .bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid #dbe2dc;
      padding-top: 10px;
    }
    .donation-callout {
      max-width: 55%;
    }
    .price {
      font-size: 22px;
      font-weight: bold;
      color: #244638;
    }
    .charity {
      font-family: Arial, sans-serif;
      font-size: 9px;
      color: #496353;
      line-height: 1.3;
      text-transform: uppercase;
    }
    .qr-box img {
      width: 90px;
      height: 90px;
      display: block;
    }

    @media print {
      body { background: white; padding: 0; }
      .no-print { display: none; }
      .sheet { margin: 0; gap: 0.2in; }
      .stake { border: 1px solid #bbb; }
    }
  </style>
</head>
<body>

  <div class="no-print">
    <div>
      <strong>Plant Stake Tag Generator</strong>
      <p style="font-size: 12px; color: #666;">Ready to print on cardstock or weather-resistant stake paper.</p>
    </div>
    <button class="btn-print" onclick="window.print()">Print Tags</button>
  </div>

  <div class="sheet" id="stake-container">
    <!-- Populated dynamically via plants.json -->
  </div>

  <script>
    // Replace with your actual domain (e.g., https://www.grownwithpurpose.com)
    const BASE_URL = window.location.origin + window.location.pathname.replace('print-tags.html', 'plant.html');

    fetch('plants.json')
      .then(res => res.json())
      .then(plants => {
        const container = document.getElementById('stake-container');
        plants.forEach(plant => {
          const plantUrl = `${BASE_URL}?id=${plant.id}`;
          const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(plantUrl)}`;
          const firstGalleryPhoto = plant.pictures && Object.values(plant.pictures)[0];
          const photo = plant.pic || firstGalleryPhoto;
          const photoMarkup = photo && photo.trim().toUpperCase() !== 'TODO'
            ? `<img class="plant-photo" src="${photo}" alt="${plant.name}" onerror="this.remove()">`
            : '';

          const card = document.createElement('div');
          card.className = 'stake';
          card.innerHTML = `
            <div>
              <div class="nursery-title">The Little Garden Nursery · San Jose</div>
              <div class="plant-heading">
                <h2 class="plant-name">${plant.name}</h2>
              </div>
              <div class="care-notes">
                ${plant.Care && plant.Care.trim().toUpperCase() !== 'TODO' ? `<strong>Care:</strong> ${plant.Care}` : '<strong>Care:</strong> Coming up.'}
                ${plant['Symbolism & Meanings'] ? `<br><strong>Symbolism:</strong> ${plant['Symbolism & Meanings']}` : ''}
              </div>
              ${photoMarkup}
            </div>
            <div class="bottom-row">
              <div class="donation-callout">
                <div class="price">$${plant.donation}</div>
                <div class="charity">100% donated to Hunger at Home (San Jose)</div>
              </div>
              <div class="qr-box">
                <img src="${qrApiUrl}" alt="Scan for care tips and payment">
              </div>
            </div>
          `;
          container.appendChild(card);
        });
      });
  </script>
  <script src="analytics-consent.js"></script>
</body>
</html>
